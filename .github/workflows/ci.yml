name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v5 runs on Node 24. v6 moves caching to a component with its own Terms of Use: an owner decision (#30).
      - uses: gradle/actions/setup-gradle@v5

      - name: Build, unit tests, lint, detekt
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug detekt --console=plain

      - name: Room schema is committed
        run: git diff --exit-code -- core/schemas

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
